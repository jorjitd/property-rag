name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gateway:
    name: Test gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r ../../requirements-dev.txt      - name: Run tests
        run: python -m pytest
  build-gateway:
    name: Build gateway image
    runs-on: ubuntu-latest
    needs: test-gateway
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t property-rag-gateway services/gateway