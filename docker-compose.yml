services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true #watches docker and configures itself from labels on my containers
      - --providers.docker.exposedbydefault=false #only containers with traefik.enable=true get routed, help no databases get exposed
      - --providers.docker.network=property-rag_edge #traefik needs to be on the same network as the containers it routes to
      - --entrypoints.web.address=:80 # Entry point for HTTP traffic
      - --api.dashboard=true
      - --api.insecure=true #this and the above line listen for web traffic on port 80 
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080" # Dashboard only accessible from localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro


  gateway:
    build: ./services/gateway
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.middlewares.strip-api.stripprefix.prefixes=/api
      - traefik.http.routers.api.middlewares=strip-api
      - traefik.http.services.api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [backend]
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10  





networks:
  edge: # things that traefik can reach
    name: property-rag_edge
  backend: # private traefik isnt on this network so it cant send traffic to a database
    name: property-rag_backend
  
volumes:
  postgres_data:
  qdrant_data:
  redis_data:

